name: uni_chat_sdk
description: "A new Flutter package project."
version: 1.0.0
homepage:

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  #* Localizations
  easy_localization: ^3.0.8

  # Firebase
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_auth: ^7.0.1
  firebase_app_check: ^0.5.1

  # State Management
  flutter_riverpod: ^3.4.3

  # Font
  google_fonts: ^9.0.0

  # UI
  flutter_chat_bubble: ^2.0.2
  shimmer: ^4.0.0
  photo_view: ^0.15.0
  bot_toast: ^4.1.3

  # Video
  chewie: ^1.17.4
  video_player: ^2.14.1
  cached_network_image: ^4.0.6

  # Audio
  audio_waveforms: ^2.0.2

  # Utils
  uuid: ^4.6.0

  # Cache Storage
  flutter_cache_manager: ^3.5.0

  # Media Picker
  image_picker: ^1.2.4
  file_picker: ^13.3.2
  open_file: ^4.0.0

  # Utils
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
    - assets/icons/
